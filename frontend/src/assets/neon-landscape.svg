<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 480" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Halloween Neon Landscape">
  <defs>
    <!-- Haunted Sky Gradient -->
    <linearGradient id="nx-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05020a" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#140624" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#240c38" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#12041e" stop-opacity="0.9" />
    </linearGradient>

    <!-- Harvest Blood Moon Glow -->
    <radialGradient id="nx-moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#ff7700" stop-opacity="0.75" />
      <stop offset="75%" stop-color="#e85d04" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0" />
    </radialGradient>

    <!-- Moon Texture -->
    <radialGradient id="nx-moon-body" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffe3a8" />
      <stop offset="40%" stop-color="#ffb703" />
      <stop offset="85%" stop-color="#fb8500" />
      <stop offset="100%" stop-color="#d9480f" />
    </radialGradient>

    <!-- Distant Spooky Peaks -->
    <linearGradient id="nx-r3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#090312" />
      <stop offset="50%" stop-color="#2b0e4a" />
      <stop offset="100%" stop-color="#090312" />
    </linearGradient>

    <!-- Mid Peaks (Haunted Violet to Ember Orange) -->
    <linearGradient id="nx-r2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#120524" />
      <stop offset="35%" stop-color="#7b2cbf" />
      <stop offset="68%" stop-color="#ff6600" />
      <stop offset="100%" stop-color="#1f0933" />
    </linearGradient>

    <!-- Foreground Ridge (Fiery Pumpkin) -->
    <linearGradient id="nx-r1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#150626" />
      <stop offset="40%" stop-color="#e85d04" />
      <stop offset="75%" stop-color="#ff7700" />
      <stop offset="100%" stop-color="#3c096c" />
    </linearGradient>

    <!-- Glowing Pumpkin Rim Light -->
    <linearGradient id="nx-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5400" stop-opacity="0" />
      <stop offset="25%" stop-color="#ff7700" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#ff9e00" stop-opacity="1" />
      <stop offset="80%" stop-color="#c77dff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="nx-valley" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#ff7700" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#7b2cbf" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0a0314" stop-opacity="0" />
    </radialGradient>

    <filter id="nx-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <filter id="nx-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="moon-halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1440" height="480" fill="url(#nx-sky)" />

  <!-- Stars -->
  <g fill="#ffe5b4">
    <circle cx="180" cy="70" r="1.5" opacity="0.8" />
    <circle cx="340" cy="45" r="1.2" opacity="0.6" />
    <circle cx="510" cy="85" r="1.8" opacity="0.75" />
    <circle cx="890" cy="55" r="1.4" opacity="0.65" />
    <circle cx="1060" cy="95" r="1.6" opacity="0.8" />
    <circle cx="1220" cy="40" r="1.3" opacity="0.55" />
    <circle cx="1380" cy="80" r="1.7" opacity="0.7" />
    <circle cx="95" cy="130" r="1.1" opacity="0.5" />
    <circle cx="1290" cy="140" r="1.4" opacity="0.6" />
  </g>

  <!-- Giant Harvest Blood Moon -->
  <circle cx="720" cy="150" r="110" fill="url(#nx-moon-glow)" filter="url(#moon-halo)" />
  <circle cx="720" cy="150" r="68" fill="url(#nx-moon-body)" />
  <!-- Moon Craters / Shadows -->
  <g fill="#d9480f" opacity="0.28">
    <circle cx="700" cy="135" r="16" />
    <circle cx="735" cy="165" r="22" />
    <circle cx="745" cy="125" r="12" />
    <circle cx="695" cy="170" r="10" />
    <circle cx="718" cy="180" r="8" />
  </g>

  <!-- Flying Bats Silhouettes -->
  <!-- Bat 1 (large, left of moon) -->
  <path d="M 610,130 Q 625,120 635,128 Q 638,124 640,128 Q 642,124 645,128 Q 655,120 670,130 Q 658,138 647,133 Q 640,140 633,133 Q 622,138 610,130 Z" fill="#150624" opacity="0.9" />
  <!-- Bat 2 (mid, top right of moon) -->
  <path d="M 770,95 Q 782,87 790,93 Q 792,90 794,93 Q 796,90 798,93 Q 806,87 818,95 Q 808,102 799,98 Q 794,103 789,98 Q 780,102 770,95 Z" fill="#150624" opacity="0.85" />
  <!-- Bat 3 (small, far left) -->
  <path d="M 520,105 Q 528,100 534,104 Q 535,102 537,104 Q 539,102 540,104 Q 546,100 554,105 Q 547,110 541,107 Q 537,111 533,107 Q 527,110 520,105 Z" fill="#150624" opacity="0.75" />
  <!-- Bat 4 (small, far right) -->
  <path d="M 870,120 Q 879,114 885,119 Q 887,117 889,119 Q 891,117 893,119 Q 899,114 908,120 Q 901,126 894,123 Q 889,127 884,123 Q 877,126 870,120 Z" fill="#150624" opacity="0.7" />

  <!-- Distant Ridge -->
  <g filter="url(#nx-soft)" opacity="0.9">
    <path d="M0 480 L110 290 L240 365 L390 220 L550 350 L690 250 L840 370 L1000 230 L1160 355 L1310 280 L1440 375 L1440 480 Z" fill="url(#nx-r3)" />
  </g>

  <!-- Mid Ridge (Spooky jagged) -->
  <path d="M0 480 L140 330 L290 410 L460 255 L630 390 L790 285 L950 415 L1110 270 L1290 400 L1440 320 L1440 480 Z" fill="url(#nx-r2)" opacity="0.92" />

  <!-- Primary Ridge with Luminous Neon Pumpkin Rim -->
  <path d="M0 480 L125 385 L275 442 L425 310 L595 435 L755 335 L925 450 L1085 320 L1265 435 L1440 360 L1440 480 Z" fill="url(#nx-r1)" />
  <path d="M0 480 L125 385 L275 442 L425 310 L595 435 L755 335 L925 450 L1085 320 L1265 435 L1440 360" fill="none" stroke="url(#nx-rim)" stroke-width="2.8" filter="url(#nx-glow)" />

  <!-- Foreground Silhouette with Spooky Dead Trees and Pumpkins -->
  <path d="M0 480 L170 425 L350 460 L530 405 L710 450 L890 412 L1070 455 L1250 420 L1440 452 L1440 480 Z" fill="#090212" />

  <!-- Glowing Valley Mist -->
  <ellipse cx="720" cy="480" rx="680" ry="160" fill="url(#nx-valley)" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 480" preserveAspectRatio="xMidYMax slice" role="img" aria-label="">
  <defs>
    <linearGradient id="nx-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030b1d" stop-opacity="0" />
      <stop offset="60%" stop-color="#04102a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#051536" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="nx-r1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b1a4a" />
      <stop offset="45%" stop-color="#144fe7" />
      <stop offset="78%" stop-color="#711df2" />
      <stop offset="100%" stop-color="#2b1a6b" />
    </linearGradient>
    <linearGradient id="nx-r2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#071233" />
      <stop offset="40%" stop-color="#157dff" />
      <stop offset="72%" stop-color="#9a22ff" />
      <stop offset="100%" stop-color="#0b1a4a" />
    </linearGradient>
    <linearGradient id="nx-r3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#03081c" />
      <stop offset="50%" stop-color="#0d2a6e" />
      <stop offset="100%" stop-color="#03081c" />
    </linearGradient>
    <linearGradient id="nx-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00b8ff" stop-opacity="0" />
      <stop offset="35%" stop-color="#00d0ff" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#d02ce9" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#00b8ff" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="nx-valley" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#9a22ff" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#157dff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#157dff" stop-opacity="0" />
    </radialGradient>
    <filter id="nx-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <filter id="nx-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1440" height="480" fill="url(#nx-sky)" />

  <!-- distant ridge -->
  <g filter="url(#nx-soft)" opacity="0.85">
    <path d="M0 480 L120 300 L250 372 L400 236 L560 356 L700 268 L850 380 L1010 246 L1170 366 L1320 292 L1440 388 L1440 480 Z" fill="url(#nx-r3)" />
  </g>

  <!-- mid ridge -->
  <path d="M0 480 L150 336 L300 412 L470 268 L640 396 L800 300 L960 420 L1120 286 L1300 404 L1440 330 L1440 480 Z" fill="url(#nx-r2)" opacity="0.9" />

  <!-- primary ridge with a lit rim -->
  <path d="M0 480 L130 392 L280 448 L430 322 L600 440 L760 350 L930 456 L1090 334 L1270 442 L1440 372 L1440 480 Z" fill="url(#nx-r1)" />
  <path d="M0 480 L130 392 L280 448 L430 322 L600 440 L760 350 L930 456 L1090 334 L1270 442 L1440 372" fill="none" stroke="url(#nx-rim)" stroke-width="2.4" filter="url(#nx-glow)" />

  <!-- foreground silhouette -->
  <path d="M0 480 L180 430 L360 464 L540 414 L720 456 L900 420 L1080 460 L1260 428 L1440 458 L1440 480 Z" fill="#02081a" />

  <!-- valley glow + stars -->
  <ellipse cx="720" cy="480" rx="640" ry="150" fill="url(#nx-valley)" />
  <g fill="#dff1ff">
    <circle cx="212" cy="86" r="1.7" opacity="0.7" />
    <circle cx="474" cy="52" r="1.3" opacity="0.5" />
    <circle cx="742" cy="104" r="1.9" opacity="0.65" />
    <circle cx="1010" cy="66" r="1.4" opacity="0.5" />
    <circle cx="1246" cy="118" r="1.6" opacity="0.6" />
    <circle cx="1330" cy="44" r="1.2" opacity="0.45" />
    <circle cx="96" cy="150" r="1.4" opacity="0.5" />
    <circle cx="612" cy="148" r="1.2" opacity="0.45" />
  </g>
</svg>

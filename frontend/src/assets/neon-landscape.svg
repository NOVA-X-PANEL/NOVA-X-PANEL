<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 480" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Pasargadae Cyrus Tomb Landscape">
  <defs>
    <!-- Sky Gradient: Persian Midnight Lapis Lazuli -->
    <linearGradient id="nx-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020611" stop-opacity="0.98" />
      <stop offset="35%" stop-color="#081a36" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#0f2e5c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#061329" stop-opacity="0.95" />
    </linearGradient>

    <!-- Moon Halo & Body -->
    <radialGradient id="nx-moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff2b2" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#d4af37" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#00b4d8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#081b38" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nx-moon-body" cx="35%" cy="35%\" r="65%">
      <stop offset="0%" stop-color="#fffbee" />
      <stop offset="35%" stop-color="#fcedb3" />
      <stop offset="75%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#9e7611" />
    </radialGradient>

    <!-- Mountain Ridges -->
    <linearGradient id="nx-r3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#040a17" />
      <stop offset="50%" stop-color="#0b2247" />
      <stop offset="100%" stop-color="#040a17" />
    </linearGradient>
    <linearGradient id="nx-r2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#061124" />
      <stop offset="30%" stop-color="#11376e" />
      <stop offset="70%" stop-color="#1c4587" />
      <stop offset="100%" stop-color="#09172f" />
    </linearGradient>
    <linearGradient id="nx-r1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#08162e" />
      <stop offset="45%" stop-color="#15386b" />
      <stop offset="75%" stop-color="#0c254b" />
      <stop offset="100%" stop-color="#08162e" />
    </linearGradient>

    <!-- Golden Rim Lights -->
    <linearGradient id="nx-gold-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#fff0b3" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#d4af37" stop-opacity="1" />
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="nx-tomb-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#273852" />
      <stop offset="50%" stop-color="#162438" />
      <stop offset="100%" stop-color="#091321" />
    </linearGradient>
    <linearGradient id="nx-tomb-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffeaa7" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>

    <radialGradient id="nx-valley" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#00b4d8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#020611" stop-opacity="0" />
    </radialGradient>

    <filter id="nx-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <filter id="nx-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="moon-halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1440" height="480" fill="url(#nx-sky)" />

  <!-- Stars -->
  <g fill="#ffeaa7">
    <circle cx="140" cy="65" r="1.6" opacity="0.85" />
    <circle cx="270" cy="40" r="1.2" opacity="0.6" />
    <circle cx="420" cy="75" r="1.8" opacity="0.75" />
    <circle cx="580" cy="50" r="1.4" opacity="0.65" />
    <circle cx="860" cy="45" r="1.5" opacity="0.8" />
    <circle cx="1020" cy="85" r="1.3" opacity="0.55" />
    <circle cx="1190" cy="55" r="1.9" opacity="0.7" />
    <circle cx="1340" cy="90" r="1.4" opacity="0.75" />
    <circle cx="80" cy="120" r="1.1" opacity="0.5" />
    <circle cx="1260" cy="130" r="1.3" opacity="0.6" />
    <circle cx="360" cy="110" r="1.5" fill="#90e0ef" opacity="0.7" />
    <circle cx="960" cy="115" r="1.5" fill="#90e0ef" opacity="0.7" />
  </g>

  <!-- Persian Golden Moon of Pasargadae -->
  <circle cx="720" cy="135" r="90" fill="url(#nx-moon-glow)" filter="url(#moon-halo)" />
  <circle cx="720" cy="135" r="52" fill="url(#nx-moon-body)" />
  <circle cx="720" cy="135" r="52" fill="none" stroke="#fff0b3" stroke-width="0.8" opacity="0.7" />

  <!-- Distant Zagros Mountains -->
  <g filter="url(#nx-soft)" opacity="0.88">
    <path d="M0 480 L120 280 L260 360 L410 210 L580 340 L720 230 L870 360 L1030 220 L1180 350 L1320 270 L1440 365 L1440 480 Z" fill="url(#nx-r3)" />
  </g>

  <!-- Mid Mountain Ridge -->
  <path d="M0 480 L150 325 L310 405 L480 250 L650 380 L790 280 L960 410 L1130 265 L1310 395 L1440 315 L1440 480 Z" fill="url(#nx-r2)" opacity="0.9" />

  <!-- Primary Plateau Ridge with Golden Rim -->
  <path d="M0 480 L130 380 L285 438 L430 305 L600 430 L760 330 L930 445 L1090 315 L1270 430 L1440 355 L1440 480 Z" fill="url(#nx-r1)" />
  <path d="M0 480 L130 380 L285 438 L430 305 L600 430 L760 330 L930 445 L1090 315 L1270 430 L1440 355" fill="none" stroke="url(#nx-gold-rim)" stroke-width="2.5" filter="url(#nx-glow)" />

  <!-- Pasargadae Ancient Fluted Columns (Left Flank) -->
  <g id="columns-left" stroke="#d4af37" stroke-width="0.8" opacity="0.85">
    <!-- Pillar 1 -->
    <rect x="230" y="290" width="18" height="150" fill="url(#nx-tomb-stone)" />
    <rect x="226" y="284" width="26" height="7" fill="url(#nx-tomb-gold)" />
    <rect x="225" y="438" width="28" height="8" fill="url(#nx-tomb-gold)" />
    <line x1="236" y1="291" x2="236" y2="437" stroke="#d4af37" stroke-width="0.5" opacity="0.6" />
    <line x1="242" y1="291" x2="242" y2="437" stroke="#d4af37" stroke-width="0.5" opacity="0.6" />
    <!-- Pillar 2 -->
    <rect x="310" y="320" width="16" height="130" fill="url(#nx-tomb-stone)" />
    <rect x="306" y="314" width="24" height="7" fill="url(#nx-tomb-gold)" />
    <rect x="305" y="448" width="26" height="7" fill="url(#nx-tomb-gold)" />
  </g>

  <!-- Pasargadae Ancient Fluted Columns (Right Flank) -->
  <g id="columns-right" stroke="#d4af37" stroke-width="0.8" opacity="0.85">
    <!-- Pillar 3 -->
    <rect x="1110" y="320" width="16" height="130" fill="url(#nx-tomb-stone)" />
    <rect x="1106" y="314" width="24" height="7" fill="url(#nx-tomb-gold)" />
    <rect x="1105" y="448" width="26" height="7" fill="url(#nx-tomb-gold)" />
    <!-- Pillar 4 -->
    <rect x="1190" y="290" width="18" height="150" fill="url(#nx-tomb-stone)" />
    <rect x="1186" y="284" width="26" height="7" fill="url(#nx-tomb-gold)" />
    <rect x="1185" y="438" width="28" height="8" fill="url(#nx-tomb-gold)" />
    <line x1="1196" y1="291" x2="1196" y2="437" stroke="#d4af37" stroke-width="0.5" opacity="0.6" />
    <line x1="1202" y1="291" x2="1202" y2="437" stroke="#d4af37" stroke-width="0.5" opacity="0.6" />
  </g>

  <!-- ======================================================== -->
  <!-- THE TOMB OF CYRUS THE GREAT (آرامگاه کوروش بزرگ در پاسارگاد) -->
  <!-- ======================================================== -->
  <g id="cyrus-great-tomb" filter="url(#nx-glow)">
    <!-- Gabled Triangular Stone Roof -->
    <polygon points="720,205 605,255 835,255" fill="url(#nx-tomb-gold)" stroke="#fff0b3" stroke-width="1.5" />
    <polygon points="720,210 615,252 825,252" fill="url(#nx-tomb-stone)" />
    <!-- Roof Stone Bevels -->
    <line x1="600" y1="255" x2="840" y2="255" stroke="#ffd700" stroke-width="2.5" />

    <!-- Sacred Burial Chamber -->
    <rect x="618" y="255" width="204" height="52" fill="url(#nx-tomb-stone)" stroke="#d4af37" stroke-width="1.4" />
    <!-- Chamber Entrance Doorway with Sacred Light -->
    <path d="M 700 307 V 270 Q 720 264 740 270 V 307 Z" fill="#020611" stroke="#ffd700" stroke-width="1.6" />
    <path d="M 706 307 V 276 Q 720 271 734 276 V 307 Z" fill="#ffeaa7" opacity="0.85" filter="url(#nx-glow)" />

    <!-- 6-Tier Stepped Stone Plinth (سکوی شش‌پله‌ای سنگی پاسارگاد) -->
    <!-- Tier 6 -->
    <rect x="605" y="307" width="230" height="16" rx="1" fill="url(#nx-tomb-stone)" stroke="#d4af37" stroke-width="1.2" />
    <!-- Tier 5 -->
    <rect x="585" y="323" width="270" height="18" rx="1" fill="url(#nx-tomb-stone)" stroke="#d4af37" stroke-width="1.2" />
    <!-- Tier 4 -->
    <rect x="562" y="341" width="316" height="20" rx="1" fill="url(#nx-tomb-stone)" stroke="#d4af37" stroke-width="1.2" />
    <!-- Tier 3 -->
    <rect x="536" y="361" width="368" height="22" rx="1" fill="url(#nx-tomb-stone)" stroke="#d4af37" stroke-width="1.3" />
    <!-- Tier 2 -->
    <rect x="506" y="383" width="428" height="25" rx="1.5" fill="url(#nx-tomb-stone)" stroke="#d4af37" stroke-width="1.4" />
    <!-- Tier 1 (Lowest massive stone foundation) -->
    <rect x="470" y="408" width="500" height="30" rx="2" fill="url(#nx-tomb-stone)" stroke="#ffd700" stroke-width="1.6" />
  </g>

  <!-- Foreground Plains & Ancient Soil of Pasargadae -->
  <path d="M0 480 L180 435 L360 465 L540 415 L720 455 L900 422 L1080 460 L1260 430 L1440 455 L1440 480 Z" fill="#030914" />

  <!-- Golden Mist of the Imperial Valley -->
  <ellipse cx="720" cy="480" rx="700" ry="140" fill="url(#nx-valley)" />
</svg>